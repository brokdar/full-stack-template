[project]
name = "backend"
description = "__PROJECT_NAME__ API service"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "arq>=0.28.0",
    "redis>=5.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.17.3",
    "pyrefly>=1.4.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version", root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
extend-exclude = ["app/alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "PTH",    # flake8-use-pathlib
    "ISC",    # implicit string concatenation
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "ASYNC",  # flake8-async
    "PERF",   # perflint
]
ignore = [
    "E501",  # line length handled by the formatter
    "W505",
    "D100",  # module docstrings not required
    "D104",  # package docstrings not required
    "D107",  # __init__ docstrings not required
    "D401",
    "B008",  # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of tests
    "S105",  # hardcoded test credentials
    "S106",
    "D",     # docstrings optional in tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]
# SQLAlchemy's asyncio layer switches greenlets; without this, code awaited
# across the sync/async bridge is reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
